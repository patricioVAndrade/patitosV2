# El plan gratis de Supabase pausa un proyecto tras 7 días sin actividad.
# Con visitas diarias no pasa; esto lo garantiza igual. Secrets: SUPABASE_URL, SUPABASE_ANON_KEY
name: Mantener Supabase activo
on:
  schedule:
    - cron: "41 12 */3 * *"
  workflow_dispatch:
jobs:
  configurado:
    name: ¿Hay claves cargadas?
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.v.outputs.ok }}
    steps:
      - id: v
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Faltan SUPABASE_URL / SUPABASE_ANON_KEY: chequeo salteado."; fi

  ping:
    needs: configurado
    if: needs.configurado.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/v_categorias?select=slug&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null && echo OK
