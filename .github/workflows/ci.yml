# Se ejecuta en cada push y pull request. Si algo falla, no se publica.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r herramientas/requirements.txt pytest && pytest herramientas -q

  base-de-datos:
    name: Migraciones y permisos (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: patitos }
        ports: ["54322:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_URL: postgres://postgres:postgres@127.0.0.1:54322/patitos
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/00_stubs_locales.sql
          for f in supabase/migrations/*.sql; do psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Pruebas de permisos
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/permisos.test.sql

  e2e:
    name: Pruebas de punta a punta
    needs: [calidad, base-de-datos]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: patitos }
        ports: ["54322:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_URL: postgres://postgres:postgres@127.0.0.1:54322/patitos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Base de datos + PostgREST + Supabase de prueba
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/00_stubs_locales.sql
          for f in supabase/migrations/*.sql; do psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ
          POSTGREST_BIN=./postgrest ./e2e/iniciar-entorno.sh
      - name: Datos de ejemplo (migración real con un Excel de muestra)
        run: |
          pip install -r herramientas/requirements.txt
          SUPABASE_URL=http://127.0.0.1:54321 SUPABASE_SERVICE_KEY=$(cat e2e/.tmp/service_key) \
            python herramientas/migrar.py --excel e2e/datos/stock_muestra.xlsx --db e2e/datos/proveedores_muestra.db --fotos e2e/fotos
      - name: Compilar y levantar la app
        run: |
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(cat e2e/.tmp/anon_key)
          export NEXT_PUBLIC_SITIO_URL=http://localhost:3000
          npm run build
          (npm start > e2e/.tmp/next.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/ >/dev/null && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- e2e/flujo-completo.spec.ts
        env:
          E2E_FOTOS: e2e/fotos/juguete1.jpg,e2e/fotos/juguete2.jpg,e2e/fotos/juguete3.jpg
          E2E_CODIGO_LISTA: PRUEBA001
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-e2e
          path: |
            playwright-report/
            test-results/
            e2e/.tmp/*.log
