# Aplica las migraciones nuevas de supabase/migrations:
#  · a PRUEBA automáticamente cuando se mergea a main (si CI pasó)
#  · a PRODUCCIÓN solo cuando lo pedís a mano (Actions → "Base de datos" → Run workflow → produccion)
# Secrets necesarios (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN                         (supabase.com → Account → Access Tokens)
#   SUPABASE_REF_PRUEBA,  SUPABASE_DB_PASSWORD_PRUEBA
#   SUPABASE_REF_PRODUCCION, SUPABASE_DB_PASSWORD_PRODUCCION
# Alternativa más directa (no usa el token): SUPABASE_DB_URL_PRUEBA / SUPABASE_DB_URL_PRODUCCION
#   = Supabase → Connect → "Session pooler" → URI, con la contraseña de la base.
#   Si está cargada, se usa esa. GitHub no tiene IPv6, por eso va por el pooler (IPv4).
name: Base de datos

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      entorno:
        description: "¿A qué base aplicar las migraciones?"
        type: choice
        options: [prueba, produccion]
        default: prueba

concurrency:
  group: migraciones-${{ inputs.entorno || 'prueba' }}
  cancel-in-progress: false

jobs:
  configurado:
    name: ¿Hay claves cargadas?
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.v.outputs.ok }}
    steps:
      - id: v
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_URL_PRUEBA: ${{ secrets.SUPABASE_DB_URL_PRUEBA }}
          DB_URL_PRODUCCION: ${{ secrets.SUPABASE_DB_URL_PRODUCCION }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN$DB_URL_PRUEBA$DB_URL_PRODUCCION" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Faltan secretos de Supabase: no se aplican migraciones (ver README)."; fi

  migrar:
    needs: configurado
    if: needs.configurado.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.entorno || 'prueba' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ (inputs.entorno || 'prueba') == 'produccion' && secrets.SUPABASE_REF_PRODUCCION || secrets.SUPABASE_REF_PRUEBA }}
      SUPABASE_DB_PASSWORD: ${{ (inputs.entorno || 'prueba') == 'produccion' && secrets.SUPABASE_DB_PASSWORD_PRODUCCION || secrets.SUPABASE_DB_PASSWORD_PRUEBA }}
      DB_URL: ${{ (inputs.entorno || 'prueba') == 'produccion' && secrets.SUPABASE_DB_URL_PRODUCCION || secrets.SUPABASE_DB_URL_PRUEBA }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 }
      - name: Conectar con la base
        run: |
          if [ -n "$DB_URL" ]; then
            echo "Conexión por el Session pooler (secreto SUPABASE_DB_URL_*)."
            echo "DESTINO=--db-url" >> "$GITHUB_ENV"
          else
            if [ -z "$REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
              echo "::error::Faltan SUPABASE_REF_* y SUPABASE_DB_PASSWORD_* (o SUPABASE_DB_URL_*) para este entorno."; exit 1
            fi
            supabase link --project-ref "$REF"
            echo "DESTINO=--linked" >> "$GITHUB_ENV"
          fi
      - name: Ver qué se va a aplicar
        run: |
          if [ "$DESTINO" = "--db-url" ]; then supabase migration list --db-url "$DB_URL"; else supabase migration list --linked; fi
      - name: Aplicar migraciones
        run: |
          if [ "$DESTINO" = "--db-url" ]; then supabase db push --db-url "$DB_URL" --include-all --yes; else supabase db push --linked --include-all --yes; fi
